<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TV Tracker - Home</title>
  <link rel="stylesheet" href="css/halfmoon.min.css" />
  <link rel="stylesheet" href="css/index-style.css" />
</head>
<body class="dark-mode" id="top">
  <div class="page-wrapper with-navbar">
    <nav class="navbar">
      <!-- Navigation will be dynamically loaded here by js/auth.js -->
      <div class="navbar-content">
        <div class="navbar-brand">
          <span class="navbar-text">📺 TV Episode Tracker</span>
        </div>
        <div class="ms-auto">
          <button class="btn btn-action" type="button" onclick="halfmoon.toggleDarkMode()">
            <i class="far fa-moon" aria-hidden="true"></i>
            <span class="sr-only">Toggle dark mode</span>
          </button>
        </div>
      </div>
    </nav>
    <div class="content-wrapper">
      <div class="container-fluid">
        <header class="text-center mb-20">
          <h1>📺 TV Episode Tracker</h1>
          <input type="text" id="searchInput" class="form-control" placeholder="Search shows..." />
        </header>
        <main>
          <section id="searchSection" style="display: none;">
            <h2>🔍 Search Results</h2>
            <div id="searchResults" class="row row-cols-2 row-cols-md-4 g-20"></div>
          </section>

          <section id="movieSection" style="display: none;">
            <h2>🎬 Movie Results</h2>
            <div id="movieResults" class="row row-cols-2 row-cols-md-4 g-20"></div>
          </section>

          <section>
            <h2>🎯 Shows I Watch</h2>
            <div id="trackedShows" class="row row-cols-2 row-cols-md-4 g-20"></div>
          </section>

          <section>
            <h2>🎯 Featured Genre</h2>
            <label for="genreSelect">Choose a genre:</label>
            <select id="genreSelect" class="form-select">
              <option value="80">Crime</option>
              <option value="9648">Mystery</option>
              <option value="10765">Sci-Fi & Fantasy</option>
              <option value="10759">Action & Adventure</option>
              <option value="35">Comedy</option>
              <option value="18">Drama</option>
              <option value="16">Animation</option>
              <option value="99">Documentary</option>
            </select>
            <div id="genreSection" class="row row-cols-2 row-cols-md-4 g-20 genreselect"></div>
          </section>

          <section>
            <h2>📈 Trending Today</h2>
            <div id="trending" class="row row-cols-2 row-cols-md-4 g-20"></div>
          </section>

          <section>
            <h2>🔥 Popular Shows</h2>
            <div id="popular" class="row row-cols-2 row-cols-md-4 g-20"></div>
          </section>

          <section>
            <h2>🏆 Top Rated Shows</h2>
            <div id="topRated" class="row row-cols-2 row-cols-md-4 g-20"></div>
          </section>

          <section>
            <h2>🧩 Backup & Restore</h2>
            <button class="btn btn-primary" onclick="exportData()">⬇️ Export Tracker Data</button>
            <input type="file" id="importFile" accept=".json" />
            <button class="btn btn-primary" onclick="importData()">⬆️ Import Tracker Data</button>
          </section>
        </main>
        <footer class="site-footer text-center mt-20">
          <p>© 2025 TV Tracker — Built with ❤️ for your watchlist.</p>
          <p>
            <a href="calendar.html">📅 Episode Calendar</a> |
            <a href="index.html">🏠 Back to Home</a>
          </p>
        </footer>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <a href="#top" class="back-to-top">Back to Top</a>
</body>
</html>
