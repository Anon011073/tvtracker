<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile - TV Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <!-- Navigation will be dynamically loaded here by js/auth.js -->
    </nav>
    <main class="profile-page">
        <header class="profile-header">
            <h1>My Watchlist</h1>
            <p>Here are the shows you're tracking. Click on a show to manage your watch progress.</p>
            <a href="changepassword.html" class="btn btn-secondary">Change Password</a>
        </header>

        <section id="notifications-container" class="notifications-section">
            <h2>Upcoming Episodes</h2>
            <!-- Upcoming episode notifications will be loaded here -->
        </section>

        <section id="tracked-shows-container">
            <!-- Favorite shows will be loaded here by js/profile.js -->
        </section>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
