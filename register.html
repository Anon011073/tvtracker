<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TV Tracker - Register</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav>
    <a href="index.html">🏠 Home</a>
    <a href="login.html">🔑 Login</a>
  </nav>
  <header>
    <h1>Create an Account</h1>
  </header>
  <main>
    <form id="registerForm" style="text-align: center; max-width: 400px; margin: auto;">
      <input type="text" id="username" placeholder="Username" required style="display: block; width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;">
      <input type="email" id="email" placeholder="Email" required style="display: block; width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;">
      <input type="password" id="password" placeholder="Password" required style="display: block; width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box;">
      <button type="submit" class="btn">Register</button>
      <p id="message" style="margin-top: 15px;"></p>
    </form>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
